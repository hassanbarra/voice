<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محادثة صوتية</title>
<style>
  :root { --bg:#faf9f7; --card:#fff; --text:#1f1f1f; --muted:#777; --accent:#c96442; --me:#efe9e1; --line:#e4e0da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b1a; --card:#262524; --text:#eee; --muted:#9a9794; --accent:#e07a57; --me:#33302d; --line:#3a3836; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
         display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  header { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.6; font-size:16px; white-space:pre-wrap; }
  .me { background:var(--me); align-self:flex-start; }
  .bot { background:var(--card); border:1px solid var(--line); align-self:flex-end; }
  .note { color:var(--muted); font-size:13px; text-align:center; align-self:center; }
  footer { padding:10px 14px 14px; border-top:1px solid var(--line); }
  #status { text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-bottom:8px; }
  .row { display:flex; gap:8px; align-items:center; }
  input[type=text], input[type=password], textarea {
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card);
    color:var(--text); font:inherit; font-size:16px; }
  textarea { min-height:140px; }
  button { font:inherit; border:0; border-radius:12px; padding:10px 14px; background:var(--card); color:var(--text);
           border:1px solid var(--line); cursor:pointer; }
  #mic { width:64px; height:64px; border-radius:50%; background:var(--accent); color:#fff; border:0; font-size:26px; flex-shrink:0; }
  #mic.rec { animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(201,100,66,.5)} 70%{box-shadow:0 0 0 16px rgba(201,100,66,0)} 100%{box-shadow:0 0 0 0 rgba(201,100,66,0)} }
  #send { background:var(--accent); color:#fff; border:0; }
  details { padding:0 16px 8px; }
  summary { cursor:pointer; color:var(--accent); padding:10px 0; font-size:15px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .small { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; }
</style>
</head>
<body>

<header>
  <h1>محادثة صوتية</h1>
  <button id="stop" style="display:none">إيقاف الصوت</button>
</header>

<details id="settings">
  <summary>الإعدادات (املأها أول مرة)</summary>
  <label>مفتاح Anthropic</label>
  <input type="password" id="anthKey" placeholder="sk-ant-..." autocomplete="off">
  <label>مفتاح Fish Audio</label>
  <input type="password" id="fishKey" autocomplete="off">
  <label>معرّف الصوت في Fish Audio (الجزء الأخير من رابط صفحة الصوت)</label>
  <input type="text" id="voiceId" dir="ltr" autocomplete="off">
  <label>لغة كلامك</label>
  <input type="text" id="lang" dir="ltr" value="ar-SA">
  <label>وصف الشخصية وأسلوبه</label>
  <textarea id="persona"></textarea>
  <div class="row" style="margin-top:12px">
    <button id="save" style="flex:1">حفظ</button>
    <button id="clear">مسح المحادثة</button>
  </div>
  <div class="small">تُحفظ المفاتيح في متصفح هاتفك فقط. لا تشارك رابط الصفحة مع أحد بعد إدخالها.</div>
</details>

<div id="chat">
  <div class="note">هذه محاكاة بأسلوب صديقك، وليست هو. اضغط الميكروفون وتكلم.</div>
</div>

<footer>
  <div id="status"></div>
  <div class="row">
    <input type="text" id="text" placeholder="أو اكتب هنا...">
    <button id="send">إرسال</button>
    <button id="mic" aria-label="تسجيل">🎤</button>
  </div>
</footer>

<script>
const DEFAULT_PERSONA = `أنت تتحدث بأسلوب صديقي الراحل [الاسم]، بإذن منه ومن أهله.
أسلوبه: [مثلاً: مرح، يستخدم لهجة ...، يحب المزاح].
أمثلة من كلامه:
- "[جملة حقيقية منه]"
- "[جملة حقيقية منه]"

قواعد:
- ردود قصيرة وطبيعية (جملة إلى ثلاث)، كما في حديث صوتي.
- لا تؤلّف ذكريات أو أحداثاً حقيقية لا تعرفها؛ إن لم تعرف فقلها بصدق.
- لا تستخدم رموزاً أو إيموجي أو تنسيقاً، فالنص سيُقرأ بصوت عالٍ.
- إن بدا أن المحاور حزين جداً أو متعلق بالمحادثة بشكل مؤلم، كن لطيفاً وذكّره أنك محاكاة، وشجعه على الحديث مع أحبائه.`;

const $ = id => document.getElementById(id);
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

$("anthKey").value = store.get("anthKey");
$("fishKey").value = store.get("fishKey");
$("voiceId").value = store.get("voiceId", "757f521ab1a645938252fb8b8bdba2f1");
$("lang").value = store.get("lang", "ar-SA");
$("persona").value = store.get("persona", DEFAULT_PERSONA);
if (!store.get("anthKey")) $("settings").open = true;

$("save").onclick = () => {
  ["anthKey", "fishKey", "voiceId", "lang", "persona"].forEach(k => store.set(k, $(k).value.trim()));
  $("settings").open = false;
  setStatus("تم الحفظ");
};

let history = [];
$("clear").onclick = () => { history = []; $("chat").innerHTML = ""; };

function setStatus(t) { $("status").textContent = t; }
function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}

/* ---------- Speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

$("mic").onclick = () => {
  unlockAudio();
  if (!SR) { setStatus("المتصفح لا يدعم التعرف على الكلام. استخدم Chrome أو اكتب الرسالة."); return; }
  if (listening) { rec && rec.stop(); return; }
  rec = new SR();
  rec.lang = $("lang").value.trim() || "ar-SA";
  rec.interimResults = false;
  rec.onstart = () => { listening = true; $("mic").classList.add("rec"); setStatus("أستمع..."); };
  rec.onend = () => { listening = false; $("mic").classList.remove("rec"); };
  rec.onerror = e => setStatus("خطأ في الميكروفون: " + e.error);
  rec.onresult = e => {
    const t = e.results[0][0].transcript.trim();
    if (t) handleUser(t);
  };
  rec.start();
};

$("send").onclick = () => {
  unlockAudio();
  const t = $("text").value.trim();
  if (t) { $("text").value = ""; handleUser(t); }
};
$("text").addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });

/* ---------- Audio ---------- */
const player = new Audio();
function unlockAudio() {
  // يفتح تشغيل الصوت بعد ضغطة المستخدم
  player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  player.play().catch(() => {});
}
$("stop").onclick = () => { player.pause(); $("stop").style.display = "none"; };

async function speak(text) {
  const res = await fetch("https://api.fish.audio/v1/tts", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + $("fishKey").value.trim(),
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text, reference_id: $("voiceId").value.trim(), format: "mp3" })
  });
  if (!res.ok) throw new Error("Fish Audio: " + res.status + " " + (await res.text()).slice(0, 150));
  const blob = await res.blob();
  player.src = URL.createObjectURL(blob);
  $("stop").style.display = "";
  player.onended = () => { $("stop").style.display = "none"; setStatus(""); };
  await player.play();
}

/* ---------- Claude ---------- */
async function askClaude() {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": $("anthKey").value.trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json"
    },
    body: JSON.stringify({
      model: "claude-sonnet-5-5",
      max_tokens: 300,
      system: $("persona").value,
      messages: history
    })
  });
  if (!res.ok) throw new Error("Claude: " + res.status + " " + (await res.text()).slice(0, 150));
  const data = await res.json();
  return data.content.filter(b => b.type === "text").map(b => b.text).join("").trim();
}

async function handleUser(text) {
  if (!$("anthKey").value.trim() || !$("fishKey").value.trim() || !$("voiceId").value.trim()) {
    $("settings").open = true;
    setStatus("املأ الإعدادات أولاً");
    return;
  }
  addMsg("me", text);
  history.push({ role: "user", content: text });
  setStatus("يفكر...");
  let answer;
  try {
    answer = await askClaude();
  } catch (e) {
    history.pop();
    setStatus(e.message);
    return;
  }
  history.push({ role: "assistant", content: answer });
  addMsg("bot", answer);
  setStatus("يجهّز الصوت...");
  try {
    await speak(answer);
    setStatus("");
  } catch (e) {
    setStatus("تعذّر الصوت: " + e.message);
  }
}
</script>
</body>
</html>
